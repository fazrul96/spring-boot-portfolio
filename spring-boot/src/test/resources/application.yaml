spring:
  data:
    rest:
      base-path: /api
  datasource:
    url: jdbc:mysql://localhost:3306/
    username: ${DEFAULT}
    password: ${DEFAULT}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 587
    username: ${DEFAULT}
    password: ${DEFAULT}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  basePath: ${APP_BASE_PATH:http://localhost:3000} # For development environment
  #  basePath: ${APP_BASE_PATH:https://portfolio-portal.mfzrl.cyou} # For production environment
  apiPath: ${APP_API_PATH:/api/v1/}

logging:
  level:
    com.example.demo: TRACE
    org.springframework.web: ERROR
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
    io.minio: DEBUG
    root: ERROR
  file: app.log

