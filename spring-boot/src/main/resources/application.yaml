spring:
  #  batch:
  #    initialize-schema: never
  profiles:
#    active: ${ACTIVE_PROFILE:@activeProfiles@}
    active: local
  #  main:
  #    web-application-type: NONE
  application:
    name: react-spring-portfolio
  datasource:
      url: ${DATASOURCE_JDBC_URL_BASE:jdbc:mysql://localhost:3306/portfolio}
      username: ${DATASOURCE_DB_APP_USERNAME:root}
      password: ${DATASOURCE_DB_APP_PASSWORD:password}
      connection-timeout: ${DATASOURCE_CONN_TIMEOUT:5000}
      maximum-pool-size: ${DATASOURCE_READER_POOL_SIZE:5}
      idle-timeout: ${DATASOURCE_READER_POOL_IDLE_TIMEOUT:password}
      minimum-idle: ${DATASOURCE_READER_POOL_MINIMUM_IDLE:120000}
      max-lifetime: ${DATASOURCE_MAX_LIFETIME:2}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      #      ddl-auto: validate
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: Asia/Singapore
    #        dialect.storage_engine: innodb
    open-in-view: false
  data:
    rest:
      base-path: ${DATA_REST_BASE_PATH:/api}
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:4b6033751c40e9}
    password: ${MAIL_PASSWORD:0853ca693d8160}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  basePath: ${APP_BASE_PATH:http://localhost:3000} # For development environment
  #  basePath: ${APP_BASE_PATH:https://portfolio-portal.mfzrl.cyou} # For production environment
  apiPath: ${APP_API_PATH:/api/}
  privateApiPath: ${APP_PRIVATE_API_PATH:/api/v1/}
  publicApiPath: ${APP_PUBLIC_API_PATH:/api/v2/}

logging:
  level:
    com.example.demo: ${LOGGING_LEVEL_APP_DEMO:TRACE}
    org.springframework.web: ${LOGGING_LEVEL_APP_WEB:ERROR}
    org.springframework.security: ${LOGGING_LEVEL_APP_SECURITY:DEBUG}
    org.springframework.web.cors: ${LOGGING_LEVEL_APP_WEB_CORS:DEBUG}
    io.minio: ${LOGGING_LEVEL_APP_MINIO:DEBUG}
    root: ${LOGGING_LEVEL_APP_ROOT:ERROR}
