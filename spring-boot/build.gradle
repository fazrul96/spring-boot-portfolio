plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'jacoco'
	id "org.sonarqube" version "4.4.1.3373"
//	id 'checkstyle' // enforce coding style and standards
//	id 'com.github.spotbugs' version '5.3.0' // analysis tool for identifying potential issues
//	id 'findbugs' // analysis tool for identifying potential issues
//	id 'pmd' // source code analyze
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = 17
	targetCompatibility = 17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-hateoas', version: '3.2.3'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '3.2.3'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: '3.2.3'
	implementation 'org.projectlombok:lombok:1.18.28'
	testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '3.2.3'
	testImplementation group: 'io.projectreactor', name: 'reactor-test', version: '3.6.4'
	// Okta Auth0
	implementation group: 'com.okta.spring', name: 'okta-spring-boot-starter', version: '3.0.6'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Encoded Decoded
	implementation 'com.auth0:java-jwt:3.18.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.3'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
//	implementation group: 'com.okta.spring', name: 'okta-spring-sdk', version: '3.0.6'
//	implementation group: 'com.auth0', name: 'mvc-auth-commons', version: '1.11.0'
//	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
//	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// Inscription sensitive information
//	implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'
	// email: mailtrap.io
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-mail', version: '3.2.3'
	implementation group: 'org.springframework', name: 'spring-context', version: '6.1.5'
	implementation group: 'org.springframework', name: 'spring-context-support', version: '6.1.5'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf', version: '3.2.3'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
	// swagger
	implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.20'
	implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.4.0'
	// jacoco
	testImplementation group: 'junit', name: 'junit', version: '4.13.2'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.11.0'
	// tesseract
	implementation group: 'net.sourceforge.tess4j', name: 'tess4j', version: '5.11.0'
	// metrics: micrometer + prometheus
//	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version: '3.2.3'
//	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
//	implementation group: 'io.micrometer', name: 'micrometer-registry-prometheus', version: '1.12.4'
	// MinIO Configuration
	implementation group: 'io.minio', name: 'minio', version: '8.5.9'
	// Mysql Database
	implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '3.2.3'
	// PostgreSQL
//	implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3'
	// DropBox API
	implementation group: 'com.dropbox.core', name: 'dropbox-core-sdk', version: '6.1.0'
	// Google Drive API
	implementation group: 'com.google.api-client', name: 'google-api-client', version: '2.4.0'
	implementation group: 'com.google.oauth-client', name: 'google-oauth-client-jetty', version: '1.35.0'
	implementation group: 'com.google.apis', name: 'google-api-services-drive', version: 'v3-rev197-1.25.0'
}

configurations {
	all*.exclude group: 'commons-logging', module: 'commons-logging'
}

sonar {
	properties {
		property "sonar.projectKey", "fazrulromli_spring-boot-portfolio_d1026bf4-2fd9-44e0-b6d3-f17a93359d39"
		property "sonar.projectName", "Spring Boot Portfolio"
		property "sonar.host.url", "https://sonarqube-portfolio.mfzrl.cyou/"
		property "sonar.gradle.skipCompile", "true"
	}
}

// Reference https://docs.gradle.org/current/userguide/jacoco_plugin.html
jacoco {
	toolVersion = "0.8.9"
//	reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = false
		csv.required = false
		html.required = true
//		html.outputLocation = layout.buildDirectory.dir('reports/tests/test/jacocoHtml') // custom location
	}
}

jacocoTestCoverageVerification {
	violationRules {
		// This rule specifies a minimum code coverage requirement of 50%.
		rule {
			limit {
				minimum = 0.5
			}
		}

		rule {
			enabled = false
			element = 'CLASS'
			includes = ['org.gradle.*']

			limit {
				counter = 'LINE'
				value = 'TOTALCOUNT'
				maximum = 0.3
			}
		}
	}
}

tasks.named('test') {
	finalizedBy jacocoTestReport
}