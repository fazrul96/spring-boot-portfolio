import org.apache.tools.ant.filters.ReplaceTokens
import java.text.DecimalFormat

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.3'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'jacoco'
	id 'checkstyle' // enforce coding style and standards
	id 'pmd' // source code analyze
	id "org.sonarqube" version "4.4.1.3373"
	id 'com.github.spotbugs' version '6.0.12' // analysis tool for identifying potential issues
	id 'org.owasp.dependencycheck' version '9.1.0'
	id 'maven-publish'
}

group = 'com.example'
version = project.hasProperty('version') ? project.getProperty('version') : '1.0.0'

java {
	sourceCompatibility = 21
	targetCompatibility = 21
}

ext {
	snippetsDir = file('build/generated-snippets')

	SPRING_BOOT_VERSION = '3.3.5'
	LOMBOK_VERSION = '1.18.36'
	OKTA_SPRING_BOOT_STARTER_VERSION = '3.0.6'
	SWAGGER_ANNOTATIONS_VERSION = '2.2.20'
	SPRINGDOC_OPENAPI_VERSION = '2.4.0'
	MOCKITO_VERSION = '5.11.0'
	TESS4J_VERSION = '5.11.0'
	MINIO_VERSION = '8.5.9'
	GOOGLE_API_CLIENT_VERSION = '2.4.0'
	GOOGLE_OAUTH_CLIENT_JETTY_VERSION = '1.35.0'
	GOOGLE_API_SERVICES_DRIVE_VERSION = 'v3-rev197-1.25.0'
	LOGSTASH_LOGBACK_VERSION = '6.4'
	JACKSON_VERSION = '2.12.3'
	SSHJ_VERSION = '0.38.0'

	COMMONS_COLLECTIONS = '4.4'
	SPRING_CLOUD_IO_AWS_VERSION = '3.1.0'
	SPRING_CLOUD_ORG_AWS_VERSION = '2.2.6.RELEASE'
	SPRING_CLOUD_VERSION = '2022.0.0'
}

ext['tess4j.version'] = '5.11.0'

repositories {
	mavenCentral()
	mavenLocal ()
}

configurations.configureEach {
	resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

configurations {
//	compileOnly {
//		extendsFrom annotationProcessor
//	}
	all*.exclude group: 'commons-logging', module: 'commons-logging'
}

dependencies {
	// JAXB dependencies for Java 9 and above
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'
	implementation 'javax.activation:activation:1.1.1'

	// Spring Boot Starters
	implementation "org.springframework.boot:spring-boot-starter-hateoas:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-web:${SPRING_BOOT_VERSION}"
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation "org.springframework.boot:spring-boot-starter-webflux:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-mail:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.boot:spring-boot-starter-thymeleaf:${SPRING_BOOT_VERSION}"
	implementation "org.springframework.batch:spring-batch-test"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa:${SPRING_BOOT_VERSION}"
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.mockito:mockito-inline:5.0.0"

	implementation 'org.apache.commons:commons-csv:1.12.0'
	// Okta Auth0
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
	implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
	implementation "com.okta.spring:okta-spring-boot-starter:${OKTA_SPRING_BOOT_STARTER_VERSION}"
	// Add this line for OAuth2 Resource Server JWT validation support
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// JWT libraries (for custom JWT handling if needed)
	implementation 'com.auth0:java-jwt:3.18.3'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.3'

	// Email
	implementation "org.springframework:spring-context:6.1.5"
	implementation "org.springframework:spring-context-support:6.1.5"
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

	// Swagger and OpenAPI
	implementation "io.swagger.core.v3:swagger-annotations:${SWAGGER_ANNOTATIONS_VERSION}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${SPRINGDOC_OPENAPI_VERSION}"

	// Testing
	testImplementation 'junit:junit'
	testImplementation "org.mockito:mockito-core:${MOCKITO_VERSION}"
	testImplementation "org.assertj:assertj-core"
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
	testImplementation "org.mockito:mockito-inline"
	testImplementation "com.h2database:h2"
	testImplementation "org.flywaydb:flyway-core"
	testImplementation "io.projectreactor:reactor-test:3.6.4"

	// Tesseract OCR
	implementation "net.sourceforge.tess4j:tess4j:${TESS4J_VERSION}"

	// MinIO Configuration
	implementation "io.minio:minio:${MINIO_VERSION}"

	// Databases
	implementation 'mysql:mysql-connector-java:8.0.33'

	// Dropbox API
	implementation 'com.dropbox.core:dropbox-core-sdk:6.1.0'

	// Google Drive API
	implementation "com.google.api-client:google-api-client:${GOOGLE_API_CLIENT_VERSION}"
	implementation "com.google.oauth-client:google-oauth-client-jetty:${GOOGLE_OAUTH_CLIENT_JETTY_VERSION}"
	implementation "com.google.apis:google-api-services-drive:${GOOGLE_API_SERVICES_DRIVE_VERSION}"

	// Logging
	implementation "net.logstash.logback:logstash-logback-encoder:${LOGSTASH_LOGBACK_VERSION}"
	implementation "org.apache.commons:commons-collections4:${COMMONS_COLLECTIONS}"

	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	implementation "com.fasterxml.jackson.module:jackson-module-jaxb-annotations:${JACKSON_VERSION}"

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.4.2.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.4.2.Final'
	implementation "org.projectlombok:lombok:${LOMBOK_VERSION}"
	annotationProcessor "org.projectlombok:lombok:${LOMBOK_VERSION}"
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

	// SSH
//	implementation "com.hierynomus:sshj:${SSHJ_VERSION}"

	// AWS SDK
//	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
//	implementation 'software.amazon.awssdk:secretsmanager'

//	implementation group: 'com.okta.spring', name: 'okta-spring-sdk', version: '3.0.6'
//	implementation group: 'com.auth0', name: 'mvc-auth-commons', version: '1.11.0'
//	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
//	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// Inscription sensitive information
//	implementation group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.5'

	// metrics: micrometer + prometheus
//	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version: '3.2.3'
//	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
//	implementation group: 'io.micrometer', name: 'micrometer-registry-prometheus', version: '1.12.4'
}

dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${SPRING_CLOUD_IO_AWS_VERSION}"
		mavenBom "org.springframework.cloud:spring-cloud-aws-dependencies:${SPRING_CLOUD_ORG_AWS_VERSION}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${SPRING_CLOUD_VERSION}"
	}
}

jar {
	enabled = false
}
// Reference https://docs.gradle.org/current/userguide/jacoco_plugin.html
jacoco {
	toolVersion = "0.8.9"
//	reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

def activeProfiles = project.properties['activeProfiles'] ?: "local"

processResources {
	filter ReplaceTokens, tokens: [
			activeProfiles: activeProfiles
	]
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
	reports {
		html.required = true
	}
	outputs.dir snippetsDir
	systemProperty'flyway.scripts.location', System.getProperty(
			'flyway.scripts.location', 'filesystem:./src/test/resources/sql-scripts')
	systemProperty "user.country", "MY"
	systemProperty "user.language", "en"
	systemProperty "user.timeznone", "Asia/Singapore"
}

checkstyle {
	ignoreFailures = false
	showViolations = true
}

pmd {
	ignoreFailures = false
	ruleSetFiles = files('config/pmd/java-rules.xml')
	ruleSets = []
	rulesMinimumPriority = 4
	consoleOutput = true
	toolVersion = '6.55.0'
}

pmdTest {
	rulesMinimumPriority = 2
}

spotbugs {
	excludeFilter = file("config/spotbugs/excludeFilter.xml")
	spotbugsTest.enabled = false
}

tasks.withType(Checkstyle) {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(Pmd) {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
	reports {
		xml.enabled = true
		html.enabled = true
	}
}

sonar {
	properties {
		property "sonar.sourceEncoding", "UTF-8"
		property "sonar.projectName", "${project.name}"
		property "sonar.projectKey", "Portfolio-Local"
		property "sonar.token", "sqp_0c8128da27af57a08a4b754d086dcdc9d902ca65"
		property "sonar.host.url", "https://sonarqube-portfolio.mfzrl.cyou/"
		property "sonar.java.spotbugs.reportPaths", "build/reports/spotbugs/main.xml"
		property "sonar.java.pmd.reportPaths", "build/reports/pmd/main.xml"
		property "sonar.java.checkstyle.reportPaths", "build/reports/checkstyle/main.xml"
		property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.coverage.exclusions", "**/*Application.*,**/dto/*,**/config/*,**/constant/*" +
				",**/exception/*,**/properties/*" + ",**/data/model/*"
	}
}

jacocoTestReport {
	reports {
		xml.required = true
		csv.required = false
		html.required = true
//		html.outputLocation = layout.buildDirectory.dir('reports/tests/test/jacocoHtml') // custom location
	}
}

jacocoTestCoverageVerification {
	def minCov = findProperty('minCov') ?: '0.10'
	DecimalFormat decimalFormat = new DecimalFormat('#')
	def minimumCoverage = decimalFormat.parse(minCov).doubleValue()
	violationRules {
		failOnViolation = true
		rule {
			limit {
				minimum = minimumCoverage
			}
		}
		afterEvaluate {
			getClassDirectories().setFrom(classDirectories.files.collect {
				fileTree(dir: it, exclude: [
						"com/example/demo/*Application.*",
						"com/example/demo/constants/*",
						"com/example/demo/properties/*"
				])
			})
		}
	}
}

task wrapperUpdate(type: Wrapper) {
	gradleVersion = '8.7'
}