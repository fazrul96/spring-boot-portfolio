plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.2'
	id 'io.spring.dependency-management' version '1.1.2'
	id 'jacoco'
	id "org.sonarqube" version "4.4.1.3373"
//	id 'checkstyle' // enforce coding style and standards
//	id 'com.github.spotbugs' version '5.3.0' // analysis tool for identifying potential issues
//	id 'findbugs' // analysis tool for identifying potential issues
//	id 'pmd' // source code analyze
//	id 'org.sonarqube' // continuous inspection of code quality
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = 17
	targetCompatibility = 17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	// email: mailtrap.io
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework:spring-context'
	implementation 'org.springframework:spring-context-support'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	// swagger
	implementation group: 'io.swagger', name: 'swagger-annotations', version: '1.6.11'
	// jacoco
	testImplementation 'junit:junit:4.13.2'
//	testImplementation 'org.testng:testng:7.1.0'
	implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.0.3'
	// tesseract
	implementation 'net.sourceforge.tess4j:tess4j:5.8.0'
	// metrics: micrometer + prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// Mysql Database
	implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '3.2.3'
	// DropBox API
	implementation 'com.dropbox.core:dropbox-core-sdk:6.0.0'
	// Google Drive API
	implementation 'com.google.api-client:google-api-client:2.0.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
	implementation 'com.google.apis:google-api-services-drive:v3-rev20220815-2.0.0'
}

configurations {
	all*.exclude group: 'commons-logging', module: 'commons-logging'
}

sonar {
	properties {
		property "sonar.projectKey", "fazrulromli_spring-boot-portfolio_d1026bf4-2fd9-44e0-b6d3-f17a93359d39"
		property "sonar.projectName", "Spring Boot Portfolio"
		property "sonar.host.url", "http://localhost:9000"
	}
}

// Reference https://docs.gradle.org/current/userguide/jacoco_plugin.html
jacoco {
	toolVersion = "0.8.9"
//	reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = false
		csv.required = false
		html.required = true
//		html.outputLocation = layout.buildDirectory.dir('reports/tests/test/jacocoHtml') // custom location
	}
}

jacocoTestCoverageVerification {
	violationRules {
		// This rule specifies a minimum code coverage requirement of 50%.
		rule {
			limit {
				minimum = 0.5
			}
		}

		rule {
			enabled = false
			element = 'CLASS'
			includes = ['org.gradle.*']

			limit {
				counter = 'LINE'
				value = 'TOTALCOUNT'
				maximum = 0.3
			}
		}
	}
}

tasks.named('test') {
	finalizedBy jacocoTestReport
}