version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18  # Use the available Node.js version 18
    commands:
      - npm install   # Replace with the necessary installation commands for your project

  build:
    commands:
      - npm run build   # Replace with the commands to build your application

artifacts:
  files:
    - '**/*'   # Include all files in the build artifacts