version: '3'
services:
  springboot:
    build:
      context: ./spring-boot
    ports:
      - "8080:8080"
    command: ./gradlew bootrun
    networks:
      - portfolio-network
  react:
    build:
      context: ./portfolio-portal
    ports:
      - "3000:3000"
    volumes:
        - .:/app
    command: npm start
    networks:
      - portfolio-network
    depends_on:
      - springboot