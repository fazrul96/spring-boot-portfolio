version: '3'
services:
  springboot:
    build:
      context: ./spring-boot
    ports:
      - "8080:8080"
    command: ./gradlew bootrun
    networks:
      - portfolio-network

  react:
    build:
      context: ./portfolio-portal
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: npm start
    networks:
      - portfolio-network
    depends_on:
      - springboot

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio  # Default database name
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge